name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    # Creating a GitHub Release and uploading assets needs write access; the
    # default token may be read-only depending on the repository settings.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches the plugin header Version
        run: |
          set -e
          TAG="${GITHUB_REF_NAME#v}"
          HEADER_VERSION="$(grep -oP '(?<=\* Version:)\s*\K[0-9]+\.[0-9]+\.[0-9]+' wordpress-mcp-abilities/wordpress-mcp-abilities.php)"
          if [ "$TAG" != "$HEADER_VERSION" ]; then
            echo "::error::Tag v$TAG does not match plugin header Version: $HEADER_VERSION"
            exit 1
          fi
          echo "VERSION=$TAG" >> "$GITHUB_ENV"

      - name: Build reproducible zip via git archive
        run: |
          git archive --format=zip --prefix=wordpress-mcp-abilities/ \
            -o "wordpress-mcp-abilities-${VERSION}.zip" \
            "${GITHUB_SHA}:wordpress-mcp-abilities"

      - name: Verify the zip only contains the installable plugin
        run: |
          set -e
          ZIP="wordpress-mcp-abilities-${VERSION}.zip"
          LISTING="$(unzip -Z1 "$ZIP")"
          if echo "$LISTING" | grep -qvE '^wordpress-mcp-abilities/'; then
            echo "::error::Zip has entries outside wordpress-mcp-abilities/"
            exit 1
          fi
          if echo "$LISTING" | grep -qE '/(tests|\.git[^/]*|\.github|\.claude)(/|$)'; then
            echo "::error::Zip contains development-only files"
            exit 1
          fi
          echo "$LISTING" | grep -qx 'wordpress-mcp-abilities/wordpress-mcp-abilities.php'

      - name: Write SHA-256 checksum
        run: sha256sum "wordpress-mcp-abilities-${VERSION}.zip" > "wordpress-mcp-abilities-${VERSION}.zip.sha256"

      - name: Extract release notes from CHANGELOG.md
        run: |
          set -e
          awk -v h="## [${VERSION}]" '
            index($0, h) == 1 { found = 1; next }
            index($0, "## [") == 1 { found = 0 }
            /^\[[^]]+\]: / { next }
            found
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::CHANGELOG.md has no section for version ${VERSION}"
            exit 1
          fi

      - name: Attach zip and checksum to the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: |
            wordpress-mcp-abilities-${{ env.VERSION }}.zip
            wordpress-mcp-abilities-${{ env.VERSION }}.zip.sha256
